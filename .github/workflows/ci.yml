name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --version && python3 --version
      - run: npm ci
      - run: npm test
      - run: npx web-ext lint --source-dir extension --self-hosted
