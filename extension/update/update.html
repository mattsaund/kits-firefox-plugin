<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update available</title>
  <link rel="icon" href="../icons/icon.svg">
  <link rel="stylesheet" href="../options/options.css">
  <script type="module" src="update.js"></script>
</head>
<body>
  <main class="update-popup">
    <img src="../icons/icon.svg" alt="" width="36" height="36">
    <h1>Kits Editor for Firefox <span id="new-version"></span> is out</h1>
    <p class="hint">You have <span id="current-version"></span>. Firefox will ask you to confirm the install.</p>
    <div class="actions">
      <button id="download" type="button" class="primary">Download</button>
      <button id="notes" type="button" class="ghost">What's new</button>
      <button id="later" type="button" class="link">Later</button>
    </div>
  </main>
</body>
</html>
